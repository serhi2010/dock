{% extends 'base.html' %}
{% block title %}Панель оцінювання{% endblock %}
{% block content %}
<div class="container mt-4">
  <h2>📚 Ваші курси</h2>
  <ul class="list-group">
    {% for course in courses %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ course.title }}
        <a href="{% url 'grades:grade_course_detail' course.id %}" class="btn btn-sm btn-outline-primary">Оцінити учнів</a>
      </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
