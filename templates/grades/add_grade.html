{% extends 'base.html' %}
{% block title %}Оцінка для {{ student.get_full_name }}{% endblock %}
{% block content %}
<div class="container mt-4">
  <h2>Оцінка для {{ student.get_full_name }} — {{ lesson.title }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">💾 Зберегти</button>
  </form>
</div>
{% endblock %}
