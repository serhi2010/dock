{% extends "base.html" %}

{% load static %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="col-md-5 col-sm-10">
        <div class="card shadow-sm bg-dark text-white border-0">
            <div class="card-body">
                <h2 class="text-center mb-4">Вхід</h2>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Ім'я користувача</label>
                        <input type="text" id="username" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-outline-light w-100 mt-3">Увійти</button>
                </form>

                {% if messages %}
                    <div class="alert alert-info text-dark mt-3">
                        <ul class="mb-0">
                            {% for message in messages %}
                                <li>{{ message }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                {% endif %}

                <div class="mt-3 text-center">
                    <span>Немає акаунта?</span>
                    <a href="{% url 'register' %}" class="text-info">Зареєструйся</a>
                </div>
                <div class="mt-3 text-center">
                    <a href="{% url 'home' %}" class="btn btn-secondary">Повернутися на головну</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
