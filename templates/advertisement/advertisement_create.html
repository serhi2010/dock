{% extends 'base.html' %}

{% block title %}Створити оголошення{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
  <h2 class="mb-4 text-center">Створити оголошення</h2>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="POST" class="card shadow-sm p-4">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-semibold">Заголовок</label>
      <input type="text" name="title" class="form-control" placeholder="Введіть заголовок" required>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Опис</label>
      <textarea name="description" class="form-control" rows="4" placeholder="Введіть опис" required></textarea>
    </div>

    <div class="d-flex justify-content-between">
      <a href="{% url 'advertisement:advertisement_list' %}" class="btn btn-secondary">Назад</a>
      <button type="submit" class="btn btn-primary">Зберегти</button>
    </div>
  </form>
</div>
{% endblock %}
