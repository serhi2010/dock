{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
  <h2 class="mb-4">🎓 Моя навчальна панель</h2>

  {% if courses %}
    <div class="row g-4">
      {% for course in courses %}
        <div class="col-md-6">
          <div class="card border-success shadow-sm h-100">
            <div class="card-body">
              <h5 class="card-title">{{ course.title }}</h5>
              <p class="card-text">{{ course.description|truncatewords:20 }}</p>
              <a href="{% url 'courses:course_detail' course.id %}" class="btn btn-success">Перейти до курсу</a>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <div class="alert alert-info">Ви ще не записані на жоден курс.</div>
  {% endif %}
</div>

{% endblock %}
